<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Menu dùng iframe</title>

<style>
.banner {
    width: 100%;
    height: 120px;
    display: block;
}

body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
}

table {
    width: 700px;
    border-collapse: collapse;
    background: white;
}

th, td {
    border: 2px solid #333;
    padding: 10px;
    vertical-align: top;
}

.header {
    text-align: center;
    background: #ffb6c1;
}

.menu {
    width: 150px;
    background: #eee;
}

.menu a {
    display: block;
    margin: 10px 0;
    text-decoration: none;
    color: blue;
}

.content {
    text-align: center;
    height: 300px;
}

.content iframe {
    width: 350px;
    height: 230px;
    border: none;
}

.footer {
    text-align: left;
    background: #ddd;
    line-height: 1.6;
    padding-left: 15px;
}
</style>
</head>

<body>

<table>

<tr>
    <th colspan="2" class="header">
        <img src="banner.jpg" alt="Banner" class="banner">
    </th>
</tr>

<tr>

<!-- Phần B -->

</tr>
