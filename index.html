<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Menu dùng iframe</title>

<style>
.banner {
    width: 100%;
    height: 120px;
    display: block;
}

body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
}

table {
    width: 700px;
    border-collapse: collapse;
    background: white;
}

th, td {
    border: 2px solid #333;
    padding: 10px;
    vertical-align: top;
}

.header {
    text-align: center;
    background: #ffb6c1;
}

.menu {
    width: 150px;
    background: #eee;
}

.menu a {
    display: block;
    margin: 10px 0;
    text-decoration: none;
    color: blue;
}

.content {
    text-align: center;
    height: 300px;
}

.content iframe {
    width: 300px;
    height: 200px;
    border: none;
    margin-top: 20px;
}

.footer {
    text-align: center;
    background: #ddd;
    font-weight: bold;
}
</style>
</head>

<body>

<table>

<!-- HEADER -->
<tr>
    <th colspan="2" class="header">
        <img src="banner.jpg" alt="Banner" class="banner">
    </th>
</tr>

<!-- MENU + CONTENT -->
<tr>

    <!-- B: MENU -->
    <td class="menu">
        <b>Menu</b>

        <a href="img1.jpg" target="content">Ảnh 1</a>
        <a href="img2.jpg" target="content">Ảnh 2</a>
        <a href="img3.jpg" target="content">Ảnh 3</a>
    </td>

    <!-- C: CONTENT -->
    <td class="content">
        <h3>Nội dung hiển thị</h3>

        <iframe name="content"></iframe>
    </td>

</tr>

<!-- FOOTER -->
<tr>
    <td colspan="2" class="footer">
    <b>Tiểu sử bản thân</b>
    <br>Họ tên: Nguyễn Hoàng Mỹ
    <br>Ngành: Công Nghệ Thông Tin
    <br>Email: hoangmy2006of@gmail.com
    <br>Facebook: <a href="#">Xem tại đây</a>
</td>
</tr>

</table>

</body>
</html>
