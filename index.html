<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang đầu tiên</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #ff69b4;
            margin-top: 20px;
            box-shadow: 0 0 10px gray;
        }

        /* Nút bấm */
        button {
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            background: linear-gradient(to right, #ff69b4, #ff1493);
            color: white;
            margin-top: 20px;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Chữ cảm ơn (ẩn ban đầu) */
        #thanks {
            margin-top: 20px;
            font-size: 20px;
            color: #ff1493;
            display: none;
            font-weight: bold;
        }

        ol {
            width: 300px;
            margin: 30px auto;
            text-align: left;
        }

        ol li {
            padding: 10px;
            border: 3px solid #ff69b4;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        ol li:hover {
            background: pink;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>Hello GitHub 👋</h1>

    <img src="me.webp" alt="Ảnh của tôi">

    <p>Lụm</p>

    <!-- Nút bấm -->
    <button onclick="showThanks()">Click me 💖</button>

    <!-- Chữ hiện ra -->
    <div id="thanks">Cảm ơn bạn rất nhiều ❤️</div>

    <ol>
        <li>Học HTML</li>
        <li>Học CSS</li>
        <li>Đưa lên GitHub</li>
    </ol>

    <script>
        function showThanks() {
            document.getElementById("thanks").style.display = "block";
        }
    </script>

</body>
</html>
