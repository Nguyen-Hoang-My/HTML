<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Menu dùng iframe</title>

<style>
body{
    font-family: Arial;
    background:#f5f5f5;
    padding:20px;
}

/* ===== TABLE KHÓA LƯỚI ===== */
table{
    width:1200px;
    margin:auto;
    border-collapse:collapse;
    background:white;
    table-layout:fixed;
}

/* chia 4 cột bằng nhau */
col{ width:25%; }

th, td{
    border:2px solid #333;
    padding:10px;
    vertical-align:top;
}

/* ===== A: HEADER ===== */
.header{
    height:220px;      /* 🔥 đủ cao để không mất chữ */
    padding:0;
    overflow:hidden;
}

/* banner phủ full nhưng KHÔNG MÉO */
.banner{
    width:100%;
    height:100%;
    object-fit:contain;   /* 🔥 giữ trọn chữ */
    display:block;
    background:#000;      /* nền đen cho đẹp nếu dư khoảng */
}

/* ===== B: MENU ===== */
.menu{
    height:420px;
    background:#eee;
}

.menu a{
    display:block;
    margin:8px 0;
    text-decoration:none;
    color:blue;
}

/* ===== C: CONTENT ===== */
.content{
    height:420px;
    text-align:center;
}

.content iframe{
    width:100%;
    height:300px;
    border:none;
    margin-top:10px;
}

/* ===== D: FOOTER ===== */
.footer{
    height:160px;
    background:#ddd;
    line-height:1.6;
}
</style>
</head>

<body>

<table>

<!-- 🔥 CHIA 4 CỘT -->
<colgroup>
    <col><col><col><col>
</colgroup>

<!-- ===== A: HEADER (4x1) ===== -->
<tr>
    <th colspan="4" class="header">
        <img src="banner.jpg" class="banner">
    </th>
</tr>

<!-- ===== B + C ===== -->
<tr>
    <!-- B: 1 cột -->
    <td rowspan="2" class="menu">
        <b>Menu</b>
        <a href="page1.html" target="content">Trang 1</a>
        <a href="page2.html" target="content">Trang 2</a>
        <a href="page3.html" target="content">Trang 3</a>
        <a href="page4.html" target="content">Trang 4</a>
        <a href="page5.html" target="content">Trang 5</a>
    </td>

    <!-- C: 3 cột -->
    <td colspan="3" rowspan="2" class="content">
        <h3>Nội dung hiển thị</h3>
        <iframe name="content"></iframe>
    </td>
</tr>
<tr></tr>

<!-- ===== D: FOOTER (4x1) ===== -->
<tr>
    <td colspan="4" class="footer">
        <b>Tiểu sử bản thân</b><br>
        Họ tên: Nguyễn Hoàng Mỹ<br>
        Ngành: Công Nghệ Thông Tin<br>
        MSSV: 110124242<br>
        Mã lớp: DA24TTC<br>
        Email: hoangmy2006of@gmail.com<br>
        Facebook:
        <a href="https://www.facebook.com/share/1DaFiM2QZh/" target="_blank">
            Xem tại đây
        </a>
    </td>
</tr>

</table>

</body>
</html>
