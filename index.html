<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang đầu tiên</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #ff69b4;
            margin-top: 20px;
            box-shadow: 0 0 10px gray;
        }

        /* Chữ Click */
        .click-text {
            margin-top: 20px;
            font-size: 20px;
            color: #ff1493;
            cursor: pointer;
            font-weight: bold;
        }

        .click-text:hover {
            text-decoration: underline;
            color: #ff69b4;
        }

        /* Chữ cảm ơn */
        #thanks {
            margin-top: 15px;
            font-size: 20px;
            color: #ff1493;
            display: none;
        }
    </style>
</head>

<body>

    <h1>Hello GitHub 👋</h1>

    <img src="me.webp" alt="Ảnh của tôi">

    <p>Lụm</p>

    <!-- Chữ click -->
    <div class="click-text" onclick="showThanks()">
        Click me 💖
    </div>
