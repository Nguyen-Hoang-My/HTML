<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang đầu tiên</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        /* Khung chứa ảnh */
        .img-box {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            border-radius: 15px;
            border: 4px solid #ff69b4;
            box-shadow: 0 0 10px gray;
        }

        /* Chữ click me đè lên ảnh */
        .click-me {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 105, 180, 0.8);
            color: white;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        #thanks {
            margin-top: 15px;
            font-size: 18px;
            color: #ff1493;
            display: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Hello GitHub 👋</h1>

    <div class="img-box">
        <img src="me.webp" alt="Ảnh của tôi">
        <div class="click-me" onclick="showThanks()">click me</div>
    </div>

    <div id="thanks">
        Cảm ơn bạn rất nhiều ❤️
    </div>

    <script>
        function showThanks() {
            document.getElementById("thanks").style.display = "block";
        }
    </script>

</body>
</html>
