<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Menu dùng iframe</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
}

/* ⭐ KHÓA BỐ CỤC BẢNG */
table {
    width: 800px;
    border-collapse: collapse;
    background: white;
    table-layout: fixed; /* QUAN TRỌNG */
}

th, td {
    border: 2px solid #333;
    padding: 10px;
    vertical-align: top;
}

/* Header */
.header {
    background: #ffb6c1;
    height: 120px;
}

.banner {
    width: 100%;
    height: 120px;
    object-fit: cover;
}

/* Cột menu cố định */
.menu {
    width: 200px;
    background: #eee;
}

.menu a {
    display: block;
    margin: 8px 0;
    text-decoration: none;
    color: blue;
}

/* Cột nội dung cố định */
.content {
    width: 600px;
    text-align: center;
    height: 350px;
    overflow: auto; /* ⭐ chống bể layout */
}

/* iframe chiếm hết khung */
.content iframe {
    width: 100%;
    height: 280px;
    border: none;
}

/* Footer */
.footer {
    background: #ddd;
    line-height: 1.6;
    padding-left: 15px;
}
</style>
</head>

<body>

<table>

<!-- A: HEADER -->
<tr>
    <th colspan="2" class="header">
        <img src="banner.jpg" alt="Banner" class="banner">
    </th>
</tr>

<!-- B + C -->
<tr>

<!-- B -->
<td class="menu">
<b>Menu</b>

<a href="page1.html" target="content">Trang 1</a>
<a href="page2.html" target="content">Trang 2</a>
<a href="page3.html" target="content">Trang 3</a>
<a href="page4.html" target="content">Trang 4</a>
<a href="page5.html" target="content">Trang 5</a>

</td>

<!-- C -->
<td class="content">
<h3>Nội dung hiển thị</h3>
<iframe name="content" src="page1.html"></iframe>
</td>

</tr>

<!-- D: FOOTER -->
<tr>
<td colspan="2" class="footer">

</td>
</tr>

</table>

</body>
</html>
