<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Layout bảng</title>

<style>
    body {
        font-family: Arial;
        padding: 20px;
        background: #f5f5f5;
    }

    table {
        width: 700px;
        border-collapse: collapse;
        background: white;
    }

    th, td {
        border: 2px solid #333;
        padding: 10px;
        vertical-align: top;
    }

    .header {
        background: #ffb6c1;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
    }

    .left {
        width: 150px;
        background: #eee;
    }

    .content {
        height: 250px;
    }

    .footer {
        text-align: center;
        background: #ddd;
        font-weight: bold;
    }

    img {
        width: 100%;
        max-width: 200px;
    }
</style>
</head>

<body>

<table>

    <!-- A: HEADER -->
    <tr>
        <th colspan="2" class="header">
            HEADER (A)
        </th>
    </tr>

    <!-- B + C -->
    <tr>
        <!-- B: LEFT MENU -->
        <td class="left">
            <b>Menu (B)</b><br><br>

            🔗 <a href="https://google.com" target="_blank">Google</a><br><br>

            🔗 <a href="#">Link khác</a><br><br>

            🖼️ Ảnh mẫu:<br>
            <img src="me.webp" alt="ảnh">
        </td>

        <!-- C: CONTENT -->
        <td class="content">
            <h3>CONTENT (C)</h3>
            <p>
                Đây là vùng nội dung. Bạn có thể bỏ:
            </p>

            <ul>
                <li>Văn bản</li>
                <li>Hình ảnh</li>
                <li>Link</li>
                <li>Dữ liệu từ Java sau này</li>
            </ul>
        </td>
    </tr>

    <!-- D: FOOTER -->
    <tr>
        <td colspan="2" class="footer">
            FOOTER (D)
        </td>
    </tr>

</table>

</body>
</html>
