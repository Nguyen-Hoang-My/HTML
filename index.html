<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Menu đổi ảnh</title>

<style> 
.banner {
    width: 100%;
    height: 120%;
    display: block;
}
    body {
        font-family: Arial;
        padding: 20px;
        background: #f5f5f5;
    }

    table {
        width: 700px;
        border-collapse: collapse;
        background: white;
    }

    th, td {
        border: 2px solid #333;
        padding: 10px;
        vertical-align: top;
    }

    .header {
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        background: #ffb6c1;
    }

    .menu {
        width: 150px;
        background: #eee;
    }

    .menu a {
        display: block;
        margin: 10px 0;
        text-decoration: none;
        color: blue;
        cursor: pointer;
    }

    .content {
        text-align: center;
        height: 300px;
    }

    .content img {
        max-width: 300px;
        margin-top: 20px;
    }

    .footer {
        text-align: center;
        background: #ddd;
        font-weight: bold;
    }
</style>
</head>

<body>

<table>

    <!-- HEADER -->
    <tr>
    <th colspan="2" class="header">
        <img src="banner.jpg" alt="Banner" class="banner">
    </th>
</tr>

    <!-- MENU + CONTENT -->
    <tr>

        <!-- B: MENU -->
        <td class="menu">
            <b>Menu</b>

            <a onclick="showImage('img1.jpg')">Ảnh 1</a>
            <a onclick="showImage('img2.jpg')">Ảnh 2</a>
            <a onclick="showImage('img3.jpg')">Ảnh 3</a>

        </td>

        <!-- C: CONTENT -->
        <td class="content">
            <h3>Nội dung hiển thị</h3>
            <img id="mainImage" src="" alt="">
        </td>

    </tr>

    <!-- FOOTER -->
    <tr>
        <td colspan="2" class="footer">
            FOOTER
        </td>
    </tr>

</table>

<script>
function showImage(imageName) {
    document.getElementById("mainImage").src = imageName;
}
</script>

</body>
</html>
