<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang đầu tiên</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        /* Ảnh vuông bo góc */
        img {
            width: 150px;
            height: 150px;
            border-radius: 15px;   /* bo góc */
            border: 4px solid #ff69b4;
            box-shadow: 0 0 10px gray;
        }

        #thanks {
            margin-top: 15px;
            font-size: 18px;
            color: #ff1493;
            display: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Hello GitHub 👋</h1>

    <!-- Ảnh + image map -->
    <img src="me.webp" alt="Ảnh của tôi" usemap="#imgmap">

    <map name="imgmap">
        <area shape="rect"
              coords="0,0,150,150"
              title="click me!"
              href="javascript:void(0);"
              onclick="showThanks()">
    </map>

    <div id="thanks">
        Cảm ơn bạn rất nhiều ❤️
    </div>

    <script>
        function showThanks() {
            document.getElementById("thanks").style.display = "block";
        }
    </script>

</body>
</html>
