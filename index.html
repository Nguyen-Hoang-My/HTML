<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Menu dùng iframe</title>
<style>
body{
    font-family: Arial;
    background:#f5f5f5;
    padding:20px;
}
table{
    width:1200px;
    margin:auto;
    border-collapse:collapse;
    background:white;
    table-layout:fixed;
}
col{ width:25%; }
th, td{
    border:2px solid #333;
    padding:10px;
    vertical-align:top;
}

/* ===== HEADER ===== */
.header{
    height:200px;
    padding:0;
    overflow:hidden;
    position:relative;
    text-align:center;
}
.banner{
    width:100%;
    height:200px;
    object-fit:cover;
    display:block;
}
.banner-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    color:#fff;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
    pointer-events:none;
}
.banner-text h1{
    margin:0;
    font-size:32px;
    letter-spacing:2px;
}
.banner-text p{
    margin:6px 0 0;
    font-size:15px;
}

/* ===== MENU ===== */
.menu{
    height:420px;
    background:#eee;
}
.menu b{
    display:block;
    margin-bottom:10px;
    font-size:16px;
}
.menu a{
    display:block;
    margin:8px 0;
    padding:8px 12px;
    text-decoration:none;
    color:#fff;
    background:#0f3460;
    border-radius:4px;
}
.menu a:hover{
    background:#e94560;
}

/* ===== CONTENT ===== */
.content{
    height:420px;
    text-align:center;
}
.content h3{
    margin:6px 0;
}
.content iframe{
    width:100%;
    height:355px;
    border:1px solid #ccc;
    border-radius:4px;
    margin-top:6px;
}

/* ===== FOOTER ===== */
.footer{
    height:160px;
    background:#ddd;
    line-height:1.8;
}
</style>
</head>
<body>
<table>
<colgroup>
    <col><col><col><col>
</colgroup>

<tr>
    <th colspan="4" class="header">
        <img src="banner.jpg" class="banner" alt="Banner">
        <div class="banner-text">
            <h1>🎓 TRANG WEB SINH VIÊN</h1>
            <p>Khoa Công Nghệ Thông Tin</p>
        </div>
    </th>
</tr>

<tr>
    <td rowspan="2" class="menu">
        <b>📋 Menu</b>
        <a href="page1.html" target="content">📄 Trang 1</a>
        <a href="page2.html" target="content">📄 Trang 2</a>
        <a href="page3.html" target="content">📄 Trang 3</a>
        <a href="page4.html" target="content">📄 Trang 4</a>
        <a href="page5.html" target="content">📄 Trang 5</a>
    </td>
    <td colspan="3" rowspan="2" class="content">
        <h3>📌 Nội dung hiển thị</h3>
        <iframe name="content" src="about:blank"></iframe>
    </td>
</tr>
<tr></tr>

<tr>
    <td colspan="4" class="footer">
        <b>Tiểu sử bản thân</b><br>
        Họ tên: Nguyễn Hoàng Mỹ<br>
        Ngành: Công Nghệ Thông Tin<br>
        MSSV: 110124242<br>
        Mã lớp: DA24TTC<br>
        Email: hoangmy2006of@gmail.com
    </td>
</tr>
</table>
</body>
</html>
