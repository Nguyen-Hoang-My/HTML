<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Website của tôi</title>

    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
        }

        table{
            width:1200px;
            margin:auto;
            border-collapse:collapse;
            background:white;
        }

        td{
            padding:10px;
        }

        .menu a{
            text-decoration:none;
            padding:10px 20px;
            background:#3498db;
            color:white;
            border-radius:5px;
            margin-right:10px;
        }

        .menu a:hover{
            background:#2c3e50;
        }

        iframe{
            width:100%;
            height:600px;
            border:none;
        }
    </style>
</head>

<body>

<table border="1">
    <!-- Banner -->
    <tr>
        <td colspan="2">
            <img src="banner1.png" width="100%">
        </td>
    </tr>

    <!-- Menu -->
    <tr>
        <td colspan="2" class="menu">
            <a href="page1.html" target="noidung">Trang 1</a>
            <a href="page2.html" target="noidung">Trang 2</a>
            <a href="page3.html" target="noidung">Trang 3</a>
            <a href="page4.html" target="noidung">Trang 4</a>
            <a href="page5.html" target="noidung">Trang 5</a>
        </td>
    </tr>

    <!-- Nội dung -->
    <tr>
        <td colspan="2">
            <iframe name="noidung" src="page1.html"></iframe>
        </td>
    </tr>

</table>

</body>
</html>
