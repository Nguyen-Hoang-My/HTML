<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Liên quân mobile thắng bại tại kỹ năng</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 15px;
            border: 4px solid #ff69b4;
            box-shadow: 0 0 10px gray;
            display: block;
            margin-bottom: 10px;
        }

        #thanks {
            display: none;
            font-size: 18px;
            color: #ff1493;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Chào mừng đến với thế giới Minecraft</h1>

    <img src="me.webp" alt="Ảnh của tôi">

    
    <button onclick="showThanks()">Click me</button>

    
    <div id="thanks">
        free fire sống dai thành huyền thoại
    </div>

    <script>
        function showThanks() {
            document.getElementById("thanks").style.display = "block";
        }
    </script>

</body>
</html>
