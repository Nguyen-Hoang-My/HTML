<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang đầu tiên</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 15px;
            border: 4px solid #ff69b4;
            box-shadow: 0 0 10px gray;
            cursor: pointer; /* chỉ báo là click được */
        }

        #thanks {
            margin-top: 15px;
            font-size: 18px;
            color: #ff1493;
            display: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Hello GitHub 👋</h1>

    <!-- Ảnh click trực tiếp, KHÔNG map, KHÔNG area -->
    <img src="me.webp"
         alt="Ảnh của tôi"
         title="click me!"
         onclick="showThanks()">

    <div id="thanks">
        Cảm ơn bạn rất nhiều ❤️
    </div>

    <script>
        function showThanks() {
            document.getElementById("thanks").style.display = "block";
        }
    </script>

</body>
</html>
